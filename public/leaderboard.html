<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 순위 | 국어 놀이터</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .board { width: min(100% - 64px, 1480px); margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; }
    .board main { flex: 1; }
    .board .app-header { min-height: 72px; }
    .board .app-footer { min-height: 54px; margin-top: 20px; }
    .board-title { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: clamp(16px, 4vh, 46px) 0 16px; }
    .board-title p { color: var(--blue); font-weight: 800; margin-bottom: 5px; }
    .board-title h1 { font-size: clamp(2.5rem, 6.4vw, 6.8rem); letter-spacing: -.09em; line-height: 1.05; }
    .board-tiles { display: flex; flex: none; align-items: center; gap: 6px; margin-right: 9px; }
    .board-tiles span { display: grid; place-items: center; width: clamp(30px, 5vw, 68px); aspect-ratio: 1; border: 1.5px solid var(--ink); border-radius: 14%; box-shadow: 2px 3px 0 var(--ink); font-size: clamp(1rem, 3vw, 2.65rem); font-weight: 900; }
    .board-tiles span:first-child { transform: rotate(-9deg); }
    .board-tiles span:nth-child(2) { transform: rotate(8deg); }
    .board-avatar { width: clamp(52px, 8.4vw, 128px); margin-left: -3px; }
    .top-three { display: grid; grid-template-columns: 1.22fr 1fr 1fr; gap: 12px; list-style: none; padding: 0; }
    .podium-card { display: grid; grid-template-columns: auto minmax(0, 1fr); align-content: start; column-gap: 12px; row-gap: 5px; padding: clamp(12px, 2.1vw, 28px); border-radius: 12px; border: 1px solid #dfb24a; background: #fff0c9; }
    .podium-card:nth-child(2) { background: #ffe3ea; border-color: #dcafba; }
    .podium-card:nth-child(3) { background: #e5f5e9; border-color: #b9d8c3; }
    .podium-card .stage-number { grid-row: span 3; width: clamp(35px, 4.1vw, 56px); font-size: clamp(1.1rem, 2.1vw, 1.75rem); }
    .podium-nick { font-size: clamp(1.04rem, 2.25vw, 2.3rem); font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
    .podium-score { font-size: clamp(1.05rem, 2.9vw, 2.8rem); font-weight: 900; color: var(--blue); line-height: 1.05; }
    .podium-mode { font-size: .88rem; color: var(--muted); }
    .board-table { min-width: 0; margin-top: 14px; font-size: clamp(.94rem, 1.55vw, 1.42rem); }
    .board-table th, .board-table td { padding: clamp(7px, 1.3vh, 14px) 12px; }
    .board-table th:nth-child(4), .board-table td:nth-child(4) { text-align: right; }
    .board footer details { position: relative; }
    .board footer summary { cursor: pointer; font-weight: 700; padding: 10px 0; }
    .board footer details .actions { position: absolute; right: 0; bottom: 100%; min-width: max-content; padding: 10px; background: var(--white); border: 1px solid var(--line); border-radius: 9px; }
    @media (max-width: 625px) {
      .board { width: calc(100% - 28px); }
      .board .app-header { min-height: 65px; }
      .board-title { gap: 10px; }
      .board-tiles span { display: none; }
      .top-three { grid-template-columns: 1fr; gap: 6px; }
      .podium-card { grid-template-columns: auto 1fr auto; column-gap: 10px; row-gap: 0; align-items: center; }
      .podium-card .stage-number { grid-row: span 2; }
      .podium-score { grid-column: 3; grid-row: 1 / span 2; }
      .podium-mode { grid-column: 2; }
      .board-table th, .board-table td { padding-inline: 6px; }
    }
  </style>
</head>
<body>
  <div class="board">
    <header class="app-header">
      <div class="event-lockup"><span class="zone-mark">ZONE <b>2</b></span><span><strong>시흥 AI+X 미래교육 페스타</strong><small>한국글로벌중학교</small></span></div>
      <a href="index.html" class="btn-utility">게임으로 ↗</a>
    </header>
    <main>
      <div class="board-title">
        <div><p>국어 놀이터</p><h1>오늘의 순위</h1></div>
        <div class="board-tiles" aria-hidden="true"><span class="step-one">말</span><span class="step-two">글</span><img class="board-avatar" src="pporaengi.png" alt=""></div>
      </div>
      <ol class="top-three" id="podium-area" aria-label="1위부터 3위까지"></ol>
      <table class="leaderboard-table board-table" aria-label="4위부터 10위까지">
        <thead><tr><th scope="col">순위</th><th scope="col">별명</th><th scope="col">난이도</th><th scope="col">점수</th></tr></thead>
        <tbody id="sub-ranks-body"></tbody>
      </table>
    </main>
    <footer class="app-footer">
      <span id="update-timer" role="status">순위를 불러오는 중이에요.</span>
      <details>
        <summary>운영 도구</summary>
        <div class="actions"><button class="btn-utility" id="btn-seed-data" aria-pressed="false">예시 기록 보기</button><button class="btn-utility" id="btn-clear-data" hidden>이 브라우저 기록 초기화</button></div>
      </details>
    </footer>
  </div>
  <script src="rankings.js"></script>
  <script>
    const sampleRecords = [
      { nickname: '배곧호랑이', score: 920, mode: '초등' },
      { nickname: '한글탐정', score: 860, mode: '초등' },
      { nickname: '시흥말랑이', score: 790, mode: '중등' },
      { nickname: '지우개대장', score: 750, mode: '초등' },
      { nickname: '말잇기왕', score: 680, mode: '초등' }
    ];
    const stepColors = ['step-one', 'step-two', 'step-three'];
    const podium = document.getElementById('podium-area');
    const rows = document.getElementById('sub-ranks-body');
    const status = document.getElementById('update-timer');
    const sampleButton = document.getElementById('btn-seed-data');
    const clearButton = document.getElementById('btn-clear-data');
    let showSamples = false;
    let liveRecords = [];
    let loading = false;
    let hasLoaded = false;
    let boardStatus = status.textContent;

    for (let index = 0; index < 3; index++) {
      const card = document.createElement('li');
      card.className = 'podium-card';
      card.innerHTML = '<span class="stage-number"></span><strong class="podium-nick"></strong><span class="podium-score"></span><span class="podium-mode"></span>';
      const rank = card.firstElementChild;
      rank.classList.add(stepColors[index]);
      rank.textContent = index + 1;
      rank.setAttribute('aria-label', `${index + 1}위`);
      podium.appendChild(card);
    }

    function renderRecords() {
      const records = showSamples ? sampleRecords : liveRecords;
      Array.from(podium.children).forEach((card, index) => {
        const entry = records[index];
        card.querySelector('.podium-nick').textContent = entry?.nickname ?? (hasLoaded || showSamples ? '아직 비어 있어요' : '–');
        card.querySelector('.podium-score').textContent = entry ? `${entry.score}점` : '–';
        card.querySelector('.podium-mode').textContent = entry?.mode ?? '';
      });
      rows.replaceChildren();
      for (const [index, entry] of records.slice(3, 10).entries()) {
        const row = rows.insertRow();
        for (const value of [`${index + 4}위`, entry.nickname, entry.mode, `${entry.score}점`]) {
          row.insertCell().textContent = value;
        }
      }
      if (records.length < 4) {
        const cell = rows.insertRow().insertCell();
        cell.colSpan = 4;
        cell.className = 'empty-cell';
        cell.textContent = '4~10위에 올라온 기록이 아직 없어요.';
      }
      const message = showSamples ? '예시 기록을 보여 주고 있어요.' : boardStatus;
      if (status.textContent !== message) status.textContent = message;
      sampleButton.textContent = showSamples ? '실제 기록 보기' : '예시 기록 보기';
      sampleButton.setAttribute('aria-pressed', String(showSamples));
    }

    async function refreshLeaderboard() {
      if (loading || showSamples) return;
      loading = true;
      try {
        liveRecords = await rankings.list();
        hasLoaded = true;
        boardStatus = rankings.localMode ? '이 브라우저의 기록을 표시하고 있어요.' : '구글 시트와 연결됐어요.';
      } catch (error) {
        boardStatus = error.code === 'not_configured'
          ? '구글 시트 연결 설정이 필요해요.'
          : (hasLoaded ? '연결이 끊겨서 마지막으로 받은 순위를 표시 중이에요.' : '순위를 불러오지 못했어요. 다시 연결하는 중이에요.');
      } finally {
        loading = false;
        renderRecords();
      }
    }

    renderRecords();
    refreshLeaderboard();
    if (rankings.localMode) {
      clearButton.hidden = false;
      window.addEventListener('storage', event => {
        if (event.key === 'siheung_rankings' || event.key === null) refreshLeaderboard();
      });
    } else {
      setInterval(refreshLeaderboard, 7000);
      window.addEventListener('online', refreshLeaderboard);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refreshLeaderboard();
      });
    }
    sampleButton.addEventListener('click', () => {
      showSamples = !showSamples;
      renderRecords();
      if (!showSamples) refreshLeaderboard();
    });
    clearButton.addEventListener('click', () => {
      if (rankings.localMode && confirm('이 브라우저에 저장된 순위 기록을 모두 지울까요?')) {
        localStorage.removeItem('siheung_rankings');
        showSamples = false;
        refreshLeaderboard();
      }
    });
  </script>
</body>
</html>
